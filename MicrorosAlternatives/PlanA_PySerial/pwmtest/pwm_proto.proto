syntax = "proto3";

// --- JETSON -> ESP32 (ACTUATOR VALUE FLOW) ---
message PwmCommand {
    int32 left_pwm = 1;   // Acceptable range: -255 to 255
    int32 right_pwm = 2;  // Acceptable range: -255 to 255
}

message JetsonToEspPacket {
    oneof packet_type {
        PwmCommand pwm = 1;
    }
}

// --- ESP32 -> JETSON (IMMEDIATE LOG ECHO) ---
message LogMessage {
    string text = 1;      // String message carrying real-time echo
}

message EspToJetsonPacket {
    oneof packet_type {
        LogMessage log = 1;
    }
}